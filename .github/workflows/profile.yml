name: Profile

# One pipeline for the whole README:
#   1. fetch stats incl. private & org repos (needs repo secret METRICS_TOKEN — see SETUP.md)
#   2. regenerate every SVG in /assets from profile.config.json + stats.json
# Runs daily, on edits to the config/scripts, and on demand.
on:
  schedule:
    - cron: "30 0 * * *"   # daily, 06:00 IST
  push:
    branches: [main]
    paths: ["profile.config.json", "scripts/**", ".github/workflows/profile.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools==4.60.1 brotli==1.1.0

      - name: Fetch stats (incl. private & org repos)
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::METRICS_TOKEN not set — keeping the committed stats.json."
          else
            python scripts/fetch_stats.py
          fi

      - run: python scripts/build_assets.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets stats.json
          git diff --staged --quiet || git commit -m "chore: refresh profile stats & visuals"
          git push
