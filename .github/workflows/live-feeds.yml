name: Live feeds (recent activity + blog posts)

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Recent public GitHub activity → <!--START_SECTION:activity-->
      - uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          GH_USERNAME: ${{ github.repository_owner }}
          MAX_LINES: 6
          COMMIT_MSG: "chore: update recent activity"

  blog:
    needs: activity
    # Set repo variable BLOG_FEEDS (Settings → Secrets and variables → Actions → Variables)
    # to comma-separated RSS URLs, e.g. https://medium.com/feed/@you,https://dev.to/feed/you
    if: ${{ vars.BLOG_FEEDS != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # pick up the activity commit from the previous job
      # Latest blog posts → <!-- BLOG-POST-LIST -->
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: ${{ vars.BLOG_FEEDS }}
          max_post_count: 5
          template: "- [$title]($url) <sub>· $date</sub>$newline"
          date_format: "mmm d, yyyy"
          commit_message: "chore: update latest posts"
