name: Rebuild profile visuals

# Edit profile.config.json on github.com → this regenerates every SVG in /assets.
on:
  push:
    branches: [main]
    paths: ["profile.config.json", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools brotli
      - run: python scripts/build_assets.py
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets
          git diff --staged --quiet || git commit -m "chore: rebuild profile visuals"
          git push
