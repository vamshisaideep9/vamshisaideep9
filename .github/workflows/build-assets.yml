name: Rebuild profile visuals

# Edit profile.config.json on github.com → this regenerates every SVG in /assets.
# Daily, it also refreshes stats.json (incl. private & org repos) using the METRICS_TOKEN secret.
on:
  schedule:
    - cron: "45 0 * * *"   # daily
  push:
    branches: [main]
    paths: ["profile.config.json", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-writer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools==4.60.1 brotli==1.1.0
      - name: Fetch stats (incl. private & org repos)
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then python scripts/fetch_stats.py; else echo "::warning::METRICS_TOKEN not set"; fi
      - run: python scripts/build_assets.py
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets stats.json
          git diff --staged --quiet || git commit -m "chore: rebuild profile visuals"
          git pull --rebase -q && git push
