<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="552" viewBox="0 0 1200 552" role="img" aria-label="whoami — terminal intro"><title>whoami — terminal intro</title><style>@font-face{font-family:'GeistMono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'GeistMono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}
    .m{font:400 16.5px 'GeistMono',monospace;white-space:pre} .bar{font:500 12.5px 'GeistMono',monospace;fill:#52525b}
    .cur{animation:blink 1.1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
    @keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
    @keyframes show{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
    .t0{animation:type 0.45s steps(6) 0.40s both}.t1{animation:show .4s ease-out 1.10s both}.t2{animation:type 0.70s steps(14) 1.30s both}.t3{animation:show .4s ease-out 2.25s both}.t4{animation:show .4s ease-out 2.45s both}.t5{animation:show .4s ease-out 2.65s both}.t6{animation:show .4s ease-out 2.85s both}.t7{animation:show .4s ease-out 3.05s both}.t8{animation:show .4s ease-out 3.25s both}.t9{animation:show .4s ease-out 3.45s both}.t10{animation:type 1.10s steps(22) 3.65s both}.t11{animation:show .4s ease-out 5.00s both}.t12{animation:type 0.45s steps(6) 5.20s both}.t13{animation:show .4s ease-out 5.90s both}.end{animation:show .2s 6.10s both}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs>
<linearGradient id="aurora" x1="0" x2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset=".5" stop-color="#7c3aed"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
<linearGradient id="hair" x1="0" x2="1"><stop offset="0" stop-color="#a1a1aa" stop-opacity="0"/><stop offset=".5" stop-color="#a1a1aa" stop-opacity=".55"/><stop offset="1" stop-color="#a1a1aa" stop-opacity="0"/></linearGradient>
<linearGradient id="glint" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed" stop-opacity="0"/><stop offset=".5" stop-color="#7c3aed" stop-opacity=".6"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></linearGradient>
<linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#09090b"/><stop offset="1" stop-color="#3f3f46"/></linearGradient>
<filter id="blur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="48"/></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
