    <text class="bar" x="600.0" y="28" text-anchor="middle">terminal — zsh</text>
    <g class="t0"><text x="40" y="92" class="m"><tspan fill="#7c3aed">vamshi@ai</tspan><tspan fill="#a1a1aa"> ~ % </tspan><tspan fill="#18181b" font-weight="500">whoami</tspan></text></g><text x="40" y="122" class="m t1" fill="#52525b"><tspan fill="#18181b">Vamshi Sai Deep — AI &amp; Full-Stack Engineer. Web, mobile and AI, idea → production.</tspan></text><g class="t2"><text x="40" y="152" class="m"><tspan fill="#7c3aed">vamshi@ai</tspan><tspan fill="#a1a1aa"> ~ % </tspan><tspan fill="#18181b" font-weight="500">cat stack.yaml</tspan></text></g><text x="40" y="182" class="m t3" fill="#52525b"><tspan fill="#0891b2">ai:</tspan><tspan fill="#18181b">        advanced RAG · agents · tool calling · MCP · evals</tspan></text><text x="40" y="212" class="m t4" fill="#52525b"><tspan fill="#0891b2">backend:</tspan><tspan fill="#18181b">   FastAPI · PostgreSQL · Redis · REST &amp; async APIs</tspan></text><text x="40" y="242" class="m t5" fill="#52525b"><tspan fill="#0891b2">frontend:</tspan><tspan fill="#18181b">  Next.js · TypeScript · Tailwind CSS · shadcn/ui</tspan></text><text x="40" y="272" class="m t6" fill="#52525b"><tspan fill="#0891b2">mobile:</tspan><tspan fill="#18181b">    Kotlin (Android) · React Native</tspan></text><text x="40" y="302" class="m t7" fill="#52525b"><tspan fill="#0891b2">cloud:</tspan><tspan fill="#18181b">     Docker · AWS · Google Cloud · DigitalOcean</tspan></text><text x="40" y="332" class="m t8" fill="#52525b"><tspan fill="#0891b2">seo:</tspan><tspan fill="#18181b">       technical SEO · keyword strategy · ranking on Google</tspan></text><text x="40" y="362" class="m t9" fill="#52525b"><tspan fill="#0891b2">ai-dev:</tspan><tspan fill="#18181b">    Claude Code · Codex — agentic, review-first workflow</tspan></text><g class="t10"><text x="40" y="392" class="m"><tspan fill="#7c3aed">vamshi@ai</tspan><tspan fill="#a1a1aa"> ~ % </tspan><tspan fill="#18181b" font-weight="500">git log --oss --recent</tspan></text></g><text x="40" y="422" class="m t11" fill="#b45309">⎇ arc53/DocsGPT — proxy support for HTTP tools (PR #1958)</text><g class="t12"><text x="40" y="452" class="m"><tspan fill="#7c3aed">vamshi@ai</tspan><tspan fill="#a1a1aa"> ~ % </tspan><tspan fill="#18181b" font-weight="500">status</tspan></text></g><text x="40" y="482" class="m t13" fill="#059669">● open to full-time roles and freelance builds</text>
