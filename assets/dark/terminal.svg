<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="672" viewBox="0 0 1200 672" role="img" aria-label="whoami — terminal intro"><title>whoami — terminal intro</title><style>@font-face{font-family:'GeistMono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'GeistMono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}
    .m{font:400 16.5px 'GeistMono',monospace;white-space:pre} .bar{font:500 12.5px 'GeistMono',monospace;fill:#9da7b3}
    .cur{animation:blink 1.1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
    @keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
    @keyframes show{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
    .t0{animation:type 0.45s steps(6) 0.40s both}.t1{animation:show .4s ease-out 1.10s both}.t2{animation:type 0.70s steps(14) 1.30s both}.t3{animation:show .4s ease-out 2.25s both}.t4{animation:show .4s ease-out 2.45s both}.t5{animation:show .4s ease-out 2.65s both}.t6{animation:show .4s ease-out 2.85s both}.t7{animation:show .4s ease-out 3.05s both}.t8{animation:show .4s ease-out 3.25s both}.t9{animation:show .4s ease-out 3.45s both}.t10{animation:type 1.10s steps(22) 3.65s both}.t11{animation:show .4s ease-out 5.00s both}.t12{animation:type 1.30s steps(26) 5.20s both}.t13{animation:show .4s ease-out 6.75s both}.t14{animation:show .4s ease-out 6.95s both}.t15{animation:show .4s ease-out 7.15s both}.t16{animation:type 0.45s steps(6) 7.35s both}.t17{animation:show .4s ease-out 8.05s both}.end{animation:show .2s 8.25s both}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs>
