    <g class="t0"><text x="40" y="92" class="m"><tspan fill="#a78bfa">vamshi@ai</tspan><tspan fill="#6e7681"> ~ % </tspan><tspan fill="#e6edf3" font-weight="500">whoami</tspan></text></g><text x="40" y="122" class="m t1" fill="#9da7b3"><tspan fill="#e6edf3">Vamshi Sai Deep — AI &amp; Full-Stack Engineer. Web, mobile and AI, idea → production.</tspan></text><g class="t2"><text x="40" y="152" class="m"><tspan fill="#a78bfa">vamshi@ai</tspan><tspan fill="#6e7681"> ~ % </tspan><tspan fill="#e6edf3" font-weight="500">cat stack.yaml</tspan></text></g><text x="40" y="182" class="m t3" fill="#9da7b3"><tspan fill="#22d3ee">ai:</tspan><tspan fill="#e6edf3">        advanced RAG · agents · tool calling · MCP · evals</tspan></text><text x="40" y="212" class="m t4" fill="#9da7b3"><tspan fill="#22d3ee">backend:</tspan><tspan fill="#e6edf3">   FastAPI · PostgreSQL · Redis · REST &amp; async APIs</tspan></text><text x="40" y="242" class="m t5" fill="#9da7b3"><tspan fill="#22d3ee">frontend:</tspan><tspan fill="#e6edf3">  Next.js · TypeScript · Tailwind CSS · shadcn/ui</tspan></text><text x="40" y="272" class="m t6" fill="#9da7b3"><tspan fill="#22d3ee">mobile:</tspan><tspan fill="#e6edf3">    Kotlin (Android) · React Native</tspan></text><text x="40" y="302" class="m t7" fill="#9da7b3"><tspan fill="#22d3ee">cloud:</tspan><tspan fill="#e6edf3">     Docker · AWS · Google Cloud · DigitalOcean</tspan></text><text x="40" y="332" class="m t8" fill="#9da7b3"><tspan fill="#22d3ee">seo:</tspan><tspan fill="#e6edf3">       technical SEO · keyword strategy · ranking on Google</tspan></text><text x="40" y="362" class="m t9" fill="#9da7b3"><tspan fill="#22d3ee">ai-dev:</tspan><tspan fill="#e6edf3">    Claude Code · Codex — agentic, review-first workflow</tspan></text><g class="t10"><text x="40" y="392" class="m"><tspan fill="#a78bfa">vamshi@ai</tspan><tspan fill="#6e7681"> ~ % </tspan><tspan fill="#e6edf3" font-weight="500">git log --oss --recent</tspan></text></g><text x="40" y="422" class="m t11" fill="#fbbf24">⎇ arc53/DocsGPT — proxy support for HTTP tools (PR #1958)</text><g class="t12"><text x="40" y="452" class="m"><tspan fill="#a78bfa">vamshi@ai</tspan><tspan fill="#6e7681"> ~ % </tspan><tspan fill="#e6edf3" font-weight="500">gh stats --include-private</tspan></text></g><text x="40" y="482" class="m t13" fill="#9da7b3"><tspan fill="#22d3ee">activity:</tspan><tspan fill="#e6edf3">  1,495 contributions in the last 12 months</tspan></text><text x="40" y="512" class="m t14" fill="#9da7b3"><tspan fill="#22d3ee">repos:</tspan><tspan fill="#e6edf3">     102 (34 private) · 463 PRs merged</tspan></text><text x="40" y="542" class="m t15" fill="#9da7b3"><tspan fill="#22d3ee">langs:</tspan><tspan fill="#e6edf3">     Python 61% · TypeScript 34% · JavaScript 4%</tspan></text><g class="t16"><text x="40" y="572" class="m"><tspan fill="#a78bfa">vamshi@ai</tspan><tspan fill="#6e7681"> ~ % </tspan><tspan fill="#e6edf3" font-weight="500">status</tspan></text></g><text x="40" y="602" class="m t17" fill="#34d399">● open to full-time roles and freelance builds</text>
